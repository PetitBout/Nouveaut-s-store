name: Mise à jour des jeux
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les jeux
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python generer_jeux.py
      - name: Sauvegarder
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add games.json
          git commit -m "maj jeux" || true
          git push
