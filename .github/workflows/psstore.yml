name: PS Store nouveautés
on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  envoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier l'heure
        id: heure
        run: |
          if [ "$(TZ=Europe/Paris date +%H)" = "20" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "go=oui" >> "$GITHUB_OUTPUT"; fi
      - name: Lancer le script
        if: steps.heure.outputs.go == 'oui'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python psstore.py
      - name: Sauvegarder la liste
        if: steps.heure.outputs.go == 'oui'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git commit -m "maj" || true
          git push
