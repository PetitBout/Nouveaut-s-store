<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swipe Jeux</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1fa;--card:#fff;--tx:#17142e;--mut:#625e7a;--line:#dcd8ee;--fav:#e8386d;--no:#4b4766;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#13112a;--card:#201d3d;--tx:#f1eefc;--mut:#a29ec0;--line:#34305a;--fav:#ff5a8a;--no:#8b86ad}}
html,body{height:100%;margin:0}
body{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--tx);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;padding:12px 16px 8px}
header button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:12px;font:inherit;font-weight:700;font-size:15px}
header button[aria-selected="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
main{flex:1;min-height:0;position:relative;padding:4px 16px 8px}
.card{position:absolute;inset:4px 16px 8px;background:var(--card);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:0 8px 28px rgba(20,16,50,.18);will-change:transform}
.cover{flex:0 0 40%;position:relative;display:flex;align-items:flex-end;padding:16px;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0) 65%)}
.cover h2{position:relative;z-index:2;margin:0;font-size:28px;line-height:1.05;font-weight:800;color:#fff}
.badge{position:absolute;z-index:3;top:14px;padding:6px 12px;border-radius:10px;font-weight:800;font-size:16px;border:3px solid;opacity:0;background:rgba(0,0,0,.35)}
.badge.fav{right:14px;color:#ff8fb0;border-color:#ff8fb0;transform:rotate(8deg)}
.badge.no{left:14px;color:#cfcde0;border-color:#cfcde0;transform:rotate(-8deg)}
.info{padding:14px 16px 6px;display:flex;gap:12px;align-items:flex-start}
.info>div:first-child{flex:1;min-width:0}
.date{margin:0 0 10px;font-size:19px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tags span{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500}
.score{flex:none;width:62px;border-radius:12px;color:#fff;text-align:center;padding:8px 0;display:flex;flex-direction:column;align-items:center}
.score b{font-size:24px;line-height:1}.score small{font-size:10px;opacity:.9;margin-top:4px}
.trailer{margin:auto 16px 16px;aspect-ratio:16/9;max-height:34%;border-radius:14px;background:#0c0a1d;color:#fff;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.trailer img,.trailer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.trailer .play{position:relative;z-index:2;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:20px}
.trailer.none{font-size:13px;opacity:.8}
.actions{display:flex;justify-content:space-between;align-items:center;padding:6px 28px 14px}
.actions button{width:68px;height:68px;border-radius:50%;border:none;font-size:28px;color:var(--on);box-shadow:0 6px 16px rgba(20,16,50,.22)}
.b-fav{background:var(--fav)}.b-no{background:var(--no)}
.actions span{color:var(--mut);font-size:13px;font-weight:500;text-align:center;line-height:1.3}
.panel{padding:8px 16px 16px;overflow:auto;height:100%;box-sizing:border-box}
.fl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fl li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px}
.dot{width:46px;height:64px;border-radius:8px;flex:none;position:relative;overflow:hidden}
.dot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fl li>div:nth-child(2){flex:1;min-width:0}
.fl b{display:block;font-size:16px}.fl small{display:block;color:var(--mut)}
.fl a{color:var(--fav);font-size:14px;font-weight:700}
.fl button{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:48px 24px;line-height:1.5}
.empty button{margin-top:14px;padding:12px 20px;border-radius:12px;border:none;background:var(--tx);color:var(--bg);font:inherit;font-weight:700}
</style>
</head>
<body>
<header role="tablist">
<button id="t1" role="tab" aria-selected="true">Découvrir</button>
<button id="t2" role="tab" aria-selected="false">Favoris (0)</button>
</header>
<main id="main"></main>
<div class="actions" id="actions">
<button class="b-no" id="bn" aria-label="Oublier ce jeu">✕</button>
<span>Glisse à droite : favori<br>Glisse à gauche : oublié</span>
<button class="b-fav" id="bf" aria-label="Ajouter aux favoris">♥</button>
</div>
<script>
var games=[],favs=[],seen=[],tab=1,busy=false,state="load",D=null,lastDx=0;
try{favs=JSON.parse(localStorage.getItem("sj_favs")||"[]");seen=JSON.parse(localStorage.getItem("sj_seen")||"[]")}catch(e){}
function save(){try{localStorage.setItem("sj_favs",JSON.stringify(favs));localStorage.setItem("sj_seen",JSON.stringify(seen))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function grad(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return "linear-gradient(150deg,hsl("+h+",65%,45%),hsl("+((h+50)%360)+",60%,22%))"}
function sc(m){return m==null?"#6b6785":m>=75?"#2e9e57":m>=50?"#c9961a":"#d23b3b"}
function dt(s){try{return new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"})}catch(e){return s}}
function next(){for(var i=0;i<games.length;i++){if(seen.indexOf(games[i].id)<0)return games[i]}return null}
function render(){
 $("t2").textContent="Favoris ("+favs.length+")";
 $("t1").setAttribute("aria-selected",tab==1);$("t2").setAttribute("aria-selected",tab==2);
 var m=$("main");m.innerHTML="";D=null;
 var g=(tab==1&&state=="ok")?next():null;
 $("actions").style.display=g?"flex":"none";
 if(tab==2){
  if(!favs.length){m.innerHTML='<div class="empty">Aucun favori pour l\'instant.<br>Glisse un jeu vers la droite pour l\'ajouter.</div>';return}
  var h='<div class="panel"><ul class="fl">';
  favs.forEach(function(f){
   h+='<li><div class="dot" style="background:'+grad(f.nom)+'">'+(f.affiche?'<img src="'+esc(f.affiche)+'" alt="" onerror="this.remove()">':"")+'</div><div><b>'+esc(f.nom)+'</b><small>'+dt(f.date)+' · '+esc(f.genres.join(", "))+'</small>'+(f.video?'<a href="https://youtu.be/'+esc(f.video)+'" target="_blank" rel="noopener">Voir le trailer</a>':"")+'</div><button data-r="'+f.id+'">Retirer</button></li>';
  });
  m.innerHTML=h+"</ul></div>";return;
 }
 if(state=="load"){m.innerHTML='<div class="empty">Chargement des jeux…</div>';return}
 if(state=="err"){m.innerHTML='<div class="empty">Impossible de charger les jeux.<br>Réessaie dans un moment.</div>';return}
 if(!g){m.innerHTML='<div class="empty">Tu as tout vu pour le moment.<br>De nouveaux jeux arrivent chaque matin.<br><button id="rs">Revoir les jeux oubliés</button></div>';return}
 var c=document.createElement("div");c.className="card";
 var tags=g.genres.map(function(x){return "<span>"+esc(x)+"</span>"}).join("");
 var tr=g.video?'<div class="trailer" data-v="'+esc(g.video)+'"><img src="https://i.ytimg.com/vi/'+esc(g.video)+'/hqdefault.jpg" alt="" draggable="false"><div class="play">▶</div></div>':'<div class="trailer none">Pas de bande-annonce pour ce jeu</div>';
 c.innerHTML='<div class="cover" style="background:'+grad(g.nom)+'">'+(g.affiche?'<img src="'+esc(g.affiche)+'" alt="" draggable="false" onerror="this.remove()">':"")+'<span class="badge fav">FAVORI</span><span class="badge no">OUBLIÉ</span><h2>'+esc(g.nom)+'</h2></div>'+
 '<div class="info"><div><p class="date">Sortie le '+dt(g.date)+'</p><div class="tags">'+tags+'</div></div><div class="score" style="background:'+sc(g.note)+'"><b>'+(g.note==null?"–":g.note)+'</b><small>Note presse</small></div></div>'+tr;
 m.appendChild(c);
 c.addEventListener("pointerdown",function(e){if(busy||e.target.closest("iframe"))return;D={c:c,g:g,x0:e.clientX,dx:0};c.style.transition="none"});
}
function decide(g,dir,c){
 if(busy)return;busy=true;
 c.style.transition="transform .25s ease-out";
 c.style.transform="translateX("+(dir<0?-130:130)+"%) rotate("+(dir<0?-14:14)+"deg)";
 setTimeout(function(){
  if(dir>0&&!favs.some(function(f){return f.id===g.id}))favs.push(g);
  seen.push(g.id);save();busy=false;render();
 },230);
}
window.addEventListener("pointerdown",function(){lastDx=0},true);
window.addEventListener("pointermove",function(e){
 if(!D)return;D.dx=e.clientX-D.x0;
 D.c.style.transform="translateX("+D.dx+"px) rotate("+D.dx/20+"deg)";
 D.c.querySelector(".badge.fav").style.opacity=D.dx>0?Math.min(1,D.dx/90):0;
 D.c.querySelector(".badge.no").style.opacity=D.dx<0?Math.min(1,-D.dx/90):0;
});
function endDrag(){
 if(!D)return;var d=D;D=null;lastDx=d.dx;
 if(Math.abs(d.dx)>90){decide(d.g,d.dx>0?1:-1,d.c)}
 else{d.c.style.transition="transform .2s";d.c.style.transform="";d.c.querySelector(".badge.fav").style.opacity=0;d.c.querySelector(".badge.no").style.opacity=0}
}
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);
$("bf").onclick=function(){var c=document.querySelector(".card"),g=next();if(c&&g)decide(g,1,c)};
$("bn").onclick=function(){var c=document.querySelector(".card"),g=next();if(c&&g)decide(g,-1,c)};
$("t1").onclick=function(){tab=1;render()};
$("t2").onclick=function(){tab=2;render()};
$("main").addEventListener("click",function(e){
 if(Math.abs(lastDx)>8)return;
 var t=e.target.closest&&e.target.closest(".trailer[data-v]");
 if(t&&!t.querySelector("iframe")){
  t.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+t.getAttribute("data-v")+'?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  return;
 }
 var r=e.target.getAttribute&&e.target.getAttribute("data-r");
 if(r){favs=favs.filter(function(f){return String(f.id)!==r});save();render();return}
 if(e.target.id=="rs"){seen=favs.map(function(f){return f.id});save();render()}
});
fetch("games.json?v="+Date.now()).then(function(r){return r.json()}).then(function(d){games=d.jeux||[];state="ok";render()}).catch(function(){state="err";render()});
render();
</script>
</body>
</html>
